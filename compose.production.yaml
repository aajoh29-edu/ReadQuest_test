name: ${PROD_COMPOSE_PROJECT_NAME:-readquest-prod}

services:
  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB:-readquest}
      POSTGRES_USER: ${PROD_POSTGRES_USER:-readquest}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?PROD_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - readquest-postgres-production:/var/lib/postgresql/data

  migrate:
    build:
      context: ./backend
      target: runtime
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://${PROD_POSTGRES_USER:-readquest}:${PROD_POSTGRES_PASSWORD}@db:5432/${PROD_POSTGRES_DB:-readquest}
      READQUEST_FRONTEND_URL: ${PROD_FRONTEND_URL:-http://localhost:8081}
      READQUEST_AUTO_VERIFY_EMAIL: ${READQUEST_AUTO_VERIFY_EMAIL:-false}
      READQUEST_COOKIE_SECURE: ${READQUEST_COOKIE_SECURE:-true}
      READQUEST_CSRF_COOKIE: ${READQUEST_CSRF_COOKIE:-rq_csrf_token}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      READQUEST_MODEL_DIR: /var/lib/readquest/models
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PROD_BACKEND_PORT:-8001}:8000"
    restart: unless-stopped
    volumes:
      - readquest-models-production:/var/lib/readquest/models:ro

  train:
    profiles: ["ml"]
    build:
      context: ./backend
      target: runtime
    environment: *backend-environment
    command: ["python", "-m", "app.ml.train", "--report"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - readquest-models-production:/var/lib/readquest/models

  frontend:
    build:
      context: .
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-ReadQuest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROD_FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  readquest-models-production:
  readquest-postgres-production:
