name: Docker CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      PROD_POSTGRES_PASSWORD: ci-build-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build cached backend test image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./backend
          target: test
          load: true
          tags: readquest-test-backend-test:latest
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Build cached frontend check image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          target: check
          load: true
          tags: readquest-test-frontend-test:latest
          cache-from: type=gha,scope=frontend-check
          cache-to: type=gha,mode=max,scope=frontend-check

      - name: Build all Docker images
        run: make build

      - name: Run backend and frontend tests
        run: make test

      - name: Audit npm and Python dependencies
        run: make audit
