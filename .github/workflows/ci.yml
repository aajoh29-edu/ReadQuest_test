name: ReadQuest CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=75

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: readquest_test
          POSTGRES_USER: readquest
          POSTGRES_PASSWORD: readquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readquest -d readquest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      READQUEST_DATABASE_URL: postgresql+psycopg://readquest:readquest@localhost:5432/readquest_test
      READQUEST_TEST_DATABASE_URL: postgresql+psycopg://readquest:readquest@localhost:5432/readquest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Migration upgrade and downgrade tests
        run: pytest -m integration
      - name: Verify models match migrations
        run: alembic upgrade head && alembic check

  architecture-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ERD documentation coverage
        run: python scripts/validate_erd_docs.py

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build API image
        run: docker compose build api
