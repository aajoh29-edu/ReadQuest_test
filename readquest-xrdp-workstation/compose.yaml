name: readquest-workstation
services:
  desktop:
    build:
      context: .
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        INSTALL_VSCODE: ${INSTALL_VSCODE:-true}
    image: readquest-dev-xrdp:local
    container_name: readquest-dev-xrdp
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${RDP_PORT:-3390}:3389"
    volumes:
      - type: bind
        source: ${READQUEST_DIR:?Set READQUEST_DIR in .env}
        target: /workspace/readquest
      - developer_home:/home/developer
    secrets:
      - rdp_password
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3389"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No Docker socket, privileged mode, or open LAN-facing RDP port.
secrets:
  rdp_password:
    file: ./.secrets/rdp_password
volumes:
  developer_home:
