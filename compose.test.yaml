name: readquest-test

services:
  test-db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: readquest_test
      POSTGRES_USER: readquest_test
      POSTGRES_PASSWORD: readquest_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  backend-test:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://readquest_test:readquest_test_only@test-db:5432/readquest_test
    command: ["sh", "-c", "alembic upgrade head && python -m pytest -q"]
    depends_on:
      test-db:
        condition: service_healthy

  # End-to-end journeys over HTTP against a migrated, seeded Postgres stack.
  e2e-backend:
    build:
      context: ./backend
      target: dev
    environment: &e2e-environment
      DATABASE_URL: postgresql+psycopg://readquest_test:readquest_test_only@test-db:5432/readquest_test
      READQUEST_AUTO_VERIFY_EMAIL: "true"
      READQUEST_COOKIE_SECURE: "false"
      READQUEST_MODEL_DIR: /tmp/models
    command:
      ["sh", "-c", "alembic upgrade head && python -m app.seeds.demo && python -m app.ml.train && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      test-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  e2e:
    build:
      context: ./backend
      target: test
    environment:
      READQUEST_E2E_BASE_URL: http://e2e-backend:8000
    command: ["python", "-m", "pytest", "-q", "tests/e2e"]
    depends_on:
      e2e-backend:
        condition: service_healthy

  frontend-test:
    build:
      context: .
      target: check

  backend-audit:
    build:
      context: ./backend
      target: audit

  frontend-audit:
    build:
      context: .
      target: deps
    command: ["npm", "audit", "--audit-level=high"]
