services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readquest}
      POSTGRES_USER: ${POSTGRES_USER:-readquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readquest}
    ports:
      - "5432:5432"
    volumes:
      - readquest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
    environment:
      READQUEST_ENV: ${READQUEST_ENV:-development}
      READQUEST_DATABASE_URL: ${READQUEST_DATABASE_URL:-postgresql+psycopg://readquest:readquest@db:5432/readquest}
      READQUEST_LOG_LEVEL: ${READQUEST_LOG_LEVEL:-INFO}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    profiles: ["seed"]
    environment:
      READQUEST_ENV: ${READQUEST_ENV:-development}
      READQUEST_DATABASE_URL: ${READQUEST_DATABASE_URL:-postgresql+psycopg://readquest:readquest@db:5432/readquest}
    command: ["python", "-m", "app.seeds.demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ./backend
    environment:
      READQUEST_ENV: ${READQUEST_ENV:-development}
      READQUEST_DATABASE_URL: ${READQUEST_DATABASE_URL:-postgresql+psycopg://readquest:readquest@db:5432/readquest}
      READQUEST_LOG_LEVEL: ${READQUEST_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # Ephemeral database used only by the `test` service below. Kept separate
  # from `db` (no volume, own container) so test runs never touch dev data
  # and the integration suite's "database name must end in _test" guard is
  # satisfied for free.
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: readquest_test
      POSTGRES_USER: readquest
      POSTGRES_PASSWORD: readquest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readquest -d readquest_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      READQUEST_ENV: development
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  readquest_postgres_data:
